<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=../index.html">
  <title>Portfolio moved — Sofiia Sanzharovska</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f6ff;
      --muted: #b6afc2;
      --violet: #7c3cff;
      --lime: #d7ff63;
      --black: #09070d;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 76% 20%, rgb(124 60 255 / 30%), transparent 34rem),
        var(--black);
      color: var(--ink);
      font-family: Inter, Avenir, "Avenir Next", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      width: min(75vw, 54rem);
      aspect-ratio: 1;
      right: -25%;
      top: -42%;
      border: 1px solid rgb(215 255 99 / 18%);
      border-radius: 50%;
      box-shadow:
        0 0 0 4rem rgb(124 60 255 / 6%),
        0 0 0 8rem rgb(215 255 99 / 3%);
      animation: orbit 18s linear infinite;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100% - 3rem, 62rem);
      padding: clamp(2.25rem, 6vw, 5rem);
      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 1.5rem;
      background: rgb(16 12 23 / 78%);
      box-shadow: 0 2rem 7rem rgb(0 0 0 / 42%);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: clamp(3rem, 8vw, 6rem);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 2.65rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #2d1d4a;
      color: var(--lime);
      font-family: Georgia, serif;
      font-size: 1.7rem;
      font-style: italic;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--lime);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 13ch;
      margin: 0;
      font-size: clamp(3rem, 8vw, 6.75rem);
      font-weight: 500;
      letter-spacing: -0.065em;
      line-height: 0.93;
    }

    h1 em {
      color: #b99aff;
      font-family: Georgia, serif;
      font-weight: 400;
    }

    .message {
      max-width: 35rem;
      margin: 2rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-top: 2.25rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      min-height: 3.25rem;
      padding: 0.85rem 1.4rem;
      border-radius: 999px;
      background: var(--lime);
      color: #21152f;
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 0.8rem 2.5rem rgb(215 255 99 / 20%);
    }

    .button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status::before {
      content: "";
      width: 0.48rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 1rem var(--lime);
      animation: pulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { to { opacity: 0.35; transform: scale(0.75); } }

    @media (max-width: 38rem) {
      main { width: min(100% - 1.5rem, 62rem); padding: 2rem 1.5rem 2.5rem; }
      .brand { margin-bottom: 3rem; }
      .actions { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
  <script>
    (() => {
      const destination = new URL("../index.html", window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body>
  <main>
    <div class="brand" aria-label="Sofiia Sanzharovska">
      <span class="mark" aria-hidden="true">s.</span>
      <span>Sofiia Sanzharovska</span>
    </div>

    <p class="eyebrow">Portfolio update</p>
    <h1>This portfolio has <em>moved.</em></h1>
    <p class="message">You are being redirected to the new homepage. If the page does not open automatically, use the button below.</p>

    <div class="actions">
      <a class="button" href="../index.html">Open the portfolio <span aria-hidden="true">↗</span></a>
      <span class="status" role="status">Redirecting now</span>
    </div>
  </main>
</body>
</html>
